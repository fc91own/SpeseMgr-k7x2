<script>

async function hashPin(pin,salt){const d=salt+":"+pin,cr=globalThis.crypto;if(cr&&cr.subtle){const b=await cr.subtle.digest("SHA-256",new TextEncoder().encode(d));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}let h=5381;for(const c of d)h=(h*33+c.charCodeAt(0))>>>0;return"w"+h.toString(36)}

function showLock(mode,msg,next){SH.slice().forEach(d=>d.close());LK.mode=mode;LK.buf="";LK.first="";LK.next=next||null;drawLock(msg);$("lock").style.display="flex"}
function hideLock(){$("lock").style.display="none"}
function drawLock(msg){const T={unlock:"Inserisci il PIN",verify:"Conferma il PIN",set1:"Nuovo PIN",set2:"Ripeti il PIN"};

async function lockKey(v){if(Date.now()<LK.until){drawLock("Troppi tentativi: riprova tra qualche secondo");return}
 if(v==="cancel"){if(LK.mode!=="unlock")hideLock();return}
 if(v==="del")LK.buf=LK.buf.slice(0,-1);else if(LK.buf.length<4)LK.buf+=v;
 drawLock("");if(LK.buf.length<4)return;const pin=LK.buf;LK.buf="";
 if(LK.mode==="unlock"||LK.mode==="verify"){const p=getPin();if(p&&await hashPin(pin,p.salt)===p.hash){LK.fails=0;const n=LK.next,m=LK.mode;hideLock();if(m==="verify"&&n)n();return}
  LK.fails++;if(LK.fails>=5){LK.until=Date.now()+30000;LK.fails=0}drawLock("PIN errato");return}
 if(LK.mode==="set1"){LK.first=pin;LK.mode="set2";drawLock("");return}
 if(LK.mode==="set2"){if(pin===LK.first){const salt=uid();lsS("pin",{salt,hash:await hashPin(pin,salt)});hideLock();toast("🔒 PIN attivato");render()}else{LK.mode="set1";drawLock("I PIN non coincidono: riprova")}}}

   if(++m>11){m=0;y++}}});
 if(add)store.cfg()}
function delPos(){const I=INV();I.pos=I.pos.filter(x=>x.id!==PE.id);$("pdlg").close();store.cfg()}
function openCand(){const I=INV();LE={sel:{}};candInv().forEach(t=>LE.sel[t.id]=guessPos(t.note||""));drawCand();openSheet("ldlg")}
function drawCand(){const I=INV(),C=candInv();
 $("ldh").innerHTML=`<button type="button" class="bsolid" data-act="closeSheet" style="border-radius:20px;padding:8px 16px">Chiudi</button><b>Da registrare</b><span style="width:76px"></span>`;
 $("ldb").innerHTML=!I.pos.length?`<div class="card">Crea prima una posizione (DEGIRO, Trade Republic, fondo pensione…) nella scheda Investimenti, poi torna qui.</div>`:`<div class="card"><small style="color:var(--mut)">Movimenti nella categoria “Investimenti” non ancora registrati. Scegli dove sono finiti i soldi e tocca ＋.</small>${C.map(t=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div class="ih"><div class="it"><b class="dsc">${esc(t.note||"(senza nota)")}</b><small>${fmtD(t.date)}</small></div><b class="out ia">${eur(t.amount)}</b></div><div class="row" style="margin-top:8px"><select data-lp="${t.id}" style="flex:1"><option value="">— scegli dove —</option>${I.pos.map(p=>`<option value="${p.id}" ${LE.sel[t.id]===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}</select><button type="button" class="pill" data-act="lcadd" data-id="${t.id}" style="padding:10px 16px;font-size:16px">＋</button></div></div>`).join("")||'<p style="color:var(--mut)">Tutto registrato.</p>'}${C.some(t=>LE.sel[t.id])?`<button type="button" class="pri" data-act="lcall" style="width:100%;margin-top:12px;padding:14px">Aggiungi tutti quelli con una posizione</button>`:""}</div>`}
$("ldlg").addEventListener("change",e=>{const d=e.target.dataset;if(d.lp!==undefined&&LE)LE.sel[d.lp]=e.target.value});
function lcAdd(txid){const t=S.tx.find(x=>x.id===txid),pid=LE.sel[txid];if(!t||!pid)return;INV().ent.push({id:uid(),date:t.date,pos:pid,amt:t.amount,note:(t.note||"").slice(0,120),tx:t.id});store.cfg();drawCand()}
function lcAll(){candInv().forEach(t=>{const pid=LE.sel[t.id];if(pid)INV().ent.push({id:uid(),date:t.date,pos:pid,amt:t.amount,note:(t.note||"").slice(0,120),tx:t.id})});store.cfg();drawCand()}
["vdlg","pdlg","ldlg"].forEach(id=>{const d=$(id);d.addEventListener("close",()=>onSheetClose(d));d.addEventListener("click",e=>{if(e.target===d&&e.clientY<d.getBoundingClientRect().top)d.close()})});
const sheetActV=sheetAct;
sheetAct=function(a,v,id,b){switch(a){
 case"inew":openEnt(null,null);return true;
 case"ient":openEnt(id);return true;
 case"ipos":openPos(id);return true;
 case"newpos":openPos(null);return true;
 case"ivw":S.ivw=v;render();return true;
 case"vneg":syncVE();VE.neg=v==="1";drawEnt();return true;
 case"vsave":saveEnt();return true;
 case"vdel":delEnt();return true;
 case"psave":savePos();return true;
 case"pdel":delPos();return true;
 case"pent":syncPE();openEnt(null,PE.id);return true;
 case"gotoinv":S.tab="gest";S.sub="inv";render();return true;
 case"icand":openCand();return true;
 case"lcadd":lcAdd(id);return true;
 case"lcall":lcAll();return true}
 return sheetActV(a,v,id,b)};
const sheetActP=sheetAct;
sheetAct=function(a,v,id,b){switch(a){
 case"addppl":{const nm=($("np").value||"").trim(),C=S.cfg,L=PEOPLE();if(!nm){$("np").focus();return true}
  if(nm.toLowerCase()==="comune"||L.some(x=>x.toLowerCase()===nm.toLowerCase())){toast("Esiste già una persona con questo nome");return true}
  C.people=L.slice();C.people.push(nm);store.cfg();toast(nm+" aggiunto/a: ora puoi intestargli dei conti");return true}
 case"delppl":{const C=S.cfg,L=PEOPLE().slice(),nm=L[+id];if(!nm||L.length<2||C.accounts.some(a=>own(a)===nm))return true;L.splice(+id,1);C.people=L;if(S.who===nm)S.who="";store.cfg();return true}}
 return sheetActP(a,v,id,b)};
function drawMp(){$("mpy").textContent=S.py;$("mpg").innerHTML=MN.map((n,i)=>`<button data-act="pm" data-v="${i}" class="${i===S.m&&S.py===S.y?"on":""}">${n.slice(0,3)}</button>`).join("")}
fallback();
if(getPin())showLock("unlock","Inserisci il PIN");
