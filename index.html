<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spese</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Spese"><meta name="theme-color" content="#3a4556">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f2ee;--card:#fff;--ink:#1f2937;--mut:#6b7280;--line:#e5e7eb;--head:#3a4556;--blue:#7b93b5;--green:#4f8a5b;--red:#b8674f;--track:#eceff1;--sand:#d9a066}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14171c;--card:#1d222a;--ink:#e5e7eb;--mut:#9aa3af;--line:#2d343e;--head:#2a3340;--track:#2d343e;--green:#7fc08c}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14171c;--card:#1d222a;--ink:#e5e7eb;--mut:#9aa3af;--line:#2d343e;--head:#2a3340;--track:#2d343e;--green:#7fc08c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;padding-bottom:90px}
header{background:var(--head);color:#fff;padding:12px 16px}
.mn{display:flex;justify-content:center;align-items:center;gap:16px;font-size:18px;font-weight:700}.mn button{background:none;border:0;color:#fff;font-size:22px;cursor:pointer}
.tot{display:flex;justify-content:space-around;margin-top:8px;font-size:12px;text-align:center}.tot b{display:block;font-size:16px}
nav{display:flex;background:var(--card);border-bottom:1px solid var(--line)}nav button{flex:1;border:0;background:none;color:var(--mut);padding:11px 4px;font:inherit;font-weight:600;cursor:pointer;border-bottom:3px solid transparent}nav button.on{color:var(--ink);border-color:var(--blue)}
main{max-width:760px;margin:0 auto;padding:12px}
select,input,button{font:inherit;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 10px}
.card{background:var(--card);border-radius:10px;padding:12px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.sg{display:flex;gap:6px;margin-bottom:10px}.sg button{flex:1;cursor:pointer}.sg button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.dh{display:flex;justify-content:space-between;color:var(--mut);font-size:12px;font-weight:600;padding:10px 4px 4px;text-transform:capitalize}
.r{display:flex;justify-content:space-between;gap:8px;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer}.r small{display:block;color:var(--mut)}
.in{color:var(--green);font-weight:700}.out{color:var(--red);font-weight:700}.tr{color:var(--mut);font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:10px;text-align:center}.cal .h{color:var(--mut);font-weight:700;padding:4px 0}
.cal .d{min-height:52px;border-radius:6px;padding:3px 1px;cursor:pointer;background:var(--track)}.cal .d.sel{outline:2px solid var(--blue)}.cal .d b{display:block;font-size:12px}.cal .e{background:none}
.cal i{display:block;font-style:normal}
.lg{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:13px}.lg span{width:10px;height:10px;border-radius:2px}.lg em{margin-left:auto;font-style:normal}.lg.s{padding-left:18px;color:var(--mut);font-size:12px}
.row{display:flex;gap:6px;align-items:center;margin-bottom:6px}.row input{flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:2px;background:var(--track);border-radius:14px;padding:2px 4px 2px 10px;margin:2px;font-size:12px}.chip button{border:0;background:none;padding:0 4px;cursor:pointer;color:var(--mut)}
.x{border:0;background:none;color:var(--mut);cursor:pointer}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));border-radius:28px;padding:14px 20px;background:var(--head);color:#fff;border:0;font-weight:700;box-shadow:0 4px 12px rgba(0,0,0,.3);cursor:pointer}
dialog{border:0;border-radius:12px;padding:16px;background:var(--card);color:var(--ink);width:min(420px,94vw)}dialog::backdrop{background:rgba(0,0,0,.4)}
dialog label{display:block;font-size:12px;color:var(--mut);margin-top:8px}dialog input,dialog select{width:100%;margin-top:2px}
.pri{background:var(--head);color:#fff;border:0;font-weight:600;cursor:pointer}
nav{overflow-x:auto}nav button{font-size:12px;flex:1 0 auto;padding:11px 10px}option{color:#000}
.k4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}@media(max-width:640px){.k4{grid-template-columns:1fr 1fr}}
.kpi{background:var(--card);border-radius:8px;padding:12px 8px;text-align:center;border-top:3px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.05)}.kpi small{font-size:10px;font-weight:700;letter-spacing:.05em;color:var(--mut)}.kpi b{display:block;font-size:22px;margin:4px 0}.kpi i{font-style:normal;font-size:11px;color:var(--mut)}
.bar{height:10px;background:var(--track);border-radius:5px;overflow:hidden}.bar div{height:100%;border-radius:5px}
.tb{overflow-x:auto}.tb table{width:100%;border-collapse:collapse;font-size:13px;min-width:540px}.tb th{font-size:10px;letter-spacing:.05em;color:var(--mut);text-align:right;padding:8px;background:var(--track)}.tb td{padding:8px;text-align:right;border-bottom:1px solid var(--line)}.tb th:first-child,.tb td:first-child{text-align:left}.tb td input{width:84px;text-align:right;padding:4px 6px}
h3.t{margin:0 0 10px;font-size:15px}
.row select{min-width:0;max-width:46%}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.mg button{padding:13px 0;cursor:pointer}.mg button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
#msg{color:var(--mut);font-size:12px;text-align:center}
</style></head><body>
<header><div class="mn"><button data-act="nav" data-v="-1">‹</button><span id="ttl" data-act="mp" style="cursor:pointer;padding:2px 6px;border-radius:8px;background:rgba(255,255,255,.14)"></span><button data-act="nav" data-v="1">›</button></div><div class="tot" id="tot"></div><div style="text-align:center;margin-top:8px"><select id="who" style="background:rgba(255,255,255,.18);color:#fff;border:0"></select></div></header>
<nav id="nav"></nav><main id="v"></main><p id="msg"></p>
<button class="fab" data-act="new">+ Movimento</button>
<dialog id="mp"><div class="row" style="justify-content:space-between"><button data-act="py" data-v="-1">‹</button><b id="mpy" style="font-size:18px"></b><button data-act="py" data-v="1">›</button></div><div class="mg" id="mpg"></div><div class="row" style="margin-top:12px"><button data-act="today" style="flex:1">Oggi</button><button data-act="mpx" style="flex:1">Chiudi</button></div></dialog>
<dialog id="dlg"><div class="sg" id="dt"></div>
<label>Importo (€)<input id="amt" type="number" step="0.01" min="0" inputmode="decimal"></label>
<div id="cw"><label>Categoria<select id="cat"></select></label><label>Sottocategoria<select id="sub"></select></label></div>
<label id="al">Conto<select id="acc"></select></label><label id="tw">Verso il conto<select id="to"></select></label>
<label>Data<input id="dat" type="date"></label><label>Nota<input id="note" placeholder="facoltativa"></label><label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="det" style="width:auto;margin:0"> Detraibile (es. retta nido, spese mediche)</label>
<div class="row" style="margin-top:14px"><button id="del" style="color:var(--red)">Elimina</button><button id="cn">Annulla</button><button class="pri" id="ok" style="flex:1">Salva</button></div></dialog>
<script>
const $=id=>document.getElementById(id),eur=n=>n.toLocaleString("it-IT",{style:"currency",currency:"EUR"}),uid=()=>Math.random().toString(36).slice(2,9);
const MN=["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];
const COL=["#7b93b5","#d9a066","#3a4556","#8aa88a","#a58bb0","#c98a7a","#a9bdd6","#e0c9a6","#7fa7a0","#b5b5b5"];
const mk=(n,s=[])=>({id:uid(),name:n,subs:s.map(x=>({id:uid(),name:x}))});
const DEF=()=>({people:["Io","Lei"],rec:[],accounts:[{id:"a1",name:"Conto bancario",start:0},{id:"a2",name:"Contanti",start:0}],cats:{out:[mk("Alimentari",["Supermercato","Ristoranti e bar"]),mk("Casa",["Affitto / Mutuo","Bollette","Manutenzione"]),mk("Trasporti",["Carburante","Mezzi pubblici"]),mk("Salute"),mk("Svago",["Viaggi","Abbonamenti"]),mk("Shopping"),mk("Altro")],in:[mk("Stipendio"),mk("Altre entrate")]}});
const n=new Date();const S={cfg:null,tx:[],m:n.getMonth(),y:n.getFullYear(),tab:"dash",view:"list",day:null,st:"out",ct:"out",edit:null,dt:"out",who:"",q:"",txL:false};
const ym=(y,m)=>y+"-"+String(m+1).padStart(2,"0"),isoD=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const cat=(t,id)=>S.cfg.cats[t].find(c=>c.id===id),acc=id=>(S.cfg.accounts.find(a=>a.id===id)||{name:"(conto eliminato)"}).name;
const lab=t=>{if(t.type==="tr")return"Trasferimento";const c=cat(t.type,t.cat);const s=c&&c.subs.find(x=>x.id===t.sub);return(c?c.name:"(categoria eliminata)")+(s?" › "+s.name:"")};
let store;const SENT=new Set();
const PEOPLE=()=>S.cfg.people||["Io","Lei"],own=a=>a.owner||PEOPLE()[0],ownId=id=>{const a=S.cfg.accounts.find(x=>x.id===id);return a?own(a):""};
const fw=t=>!S.who||ownId(t.acc)===S.who||(t.to&&ownId(t.to)===S.who);
const qf=t=>!S.q||(lab(t)+" "+(t.note||"")+" "+acc(t.acc)+" "+t.amount).toLowerCase().includes(S.q.toLowerCase());
const ownOpts=sel=>[...PEOPLE(),"Comune"].map(x=>`<option ${x===sel?"selected":""}>${x}</option>`).join("");
function lsG(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}function lsS(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function fallback(){S.cfg=lsG("cfg",null)||DEF();S.tx=lsG("tx",[]);S.txL=true;store={save:t=>{const i=S.tx.findIndex(x=>x.id===t.id);i<0?S.tx.push(t):S.tx[i]=t;lsS("tx",S.tx);render()},del:id=>{S.tx=S.tx.filter(x=>x.id!==id);lsS("tx",S.tx);render()},cfg:()=>{lsS("cfg",S.cfg);render()}};$("msg").textContent="Dati salvati su questo dispositivo: fai ogni tanto un backup (scheda Conti).";render()}
const mt=()=>S.tx.filter(t=>t.date.slice(0,7)===ym(S.y,S.m)&&fw(t));
const sum=(a,ty)=>a.filter(t=>t.type===ty).reduce((s,t)=>s+t.amount,0);
function rows(a){return a.map(t=>{const ty=t.type,sg=ty==="in"?"+":ty==="out"?"−":"";const w=ty==="tr"?acc(t.acc)+" → "+acc(t.to):acc(t.acc);
 return`<div class="r" data-act="edit" data-id="${t.id}"><div><b>${t.rid?"↻ ":""}${t.det?"🧾 ":""}${lab(t)}</b><small>${w}${t.note?" · "+t.note:""}</small></div><span class="${ty}">${sg}${eur(t.amount)}</span></div>`}).join("")}
function days(a){const g={};a.forEach(t=>(g[t.date]=g[t.date]||[]).push(t));return Object.keys(g).sort().reverse().map(d=>{const l=g[d];
 return`<div class="dh"><span>${new Date(d+"T00:00").toLocaleDateString("it-IT",{weekday:"short",day:"numeric",month:"short"})}</span><span>${sum(l,"in")?"+"+eur(sum(l,"in"))+" ":""}${sum(l,"out")?"−"+eur(sum(l,"out")):""}</span></div>`+rows(l)}).join("")||'<p style="text-align:center;color:var(--mut)">Nessun movimento.</p>'}
const V={
dash(){const a=mt(),pm=S.m?S.m-1:11,py=S.m?S.y:S.y-1,p=S.tx.filter(t=>t.date.slice(0,7)===ym(py,pm)&&fw(t));
 const e=sum(a,"in"),s=sum(a,"out"),pe=sum(p,"in"),ps=sum(p,"out"),sv=e-s,psv=pe-ps,rt=e?Math.round(sv/e*100):0,prt=pe?Math.round(psv/pe*100):0;
 const rel=(v,q)=>q?`${v>=q?"▲":"▼"} ${Math.round(Math.abs(v-q)/Math.abs(q)*100)}% rispetto al mese prima`:"—";
 const K=[["💰 ENTRATE",eur(e),rel(e,pe),"var(--green)"],["💳 SPESE",eur(s),rel(s,ps),"var(--red)"],["🏦 RISPARMIO",eur(sv),rel(sv,psv),"var(--blue)"],["📈 TASSO DI RISPARMIO",rt+"%",pe?`${rt>=prt?"▲":"▼"} ${Math.abs(rt-prt)} punti rispetto al mese prima`:"—","var(--sand)"]];
 const o=a.filter(t=>t.type==="out"),by={};o.forEach(t=>by[t.cat]=(by[t.cat]||0)+t.amount);
 const en=Object.entries(by).sort((x,y)=>y[1]-x[1]);let off=0;
 const arcs=en.map(([k,v],i)=>{const l=v/s*100,c=`<circle r="15.9155" cx="21" cy="21" fill="none" stroke="${COL[i%10]}" stroke-width="7" stroke-dasharray="${l} ${100-l}" stroke-dashoffset="${25-off}"/>`;off+=l;return c}).join("");
 const lg=en.map(([k,v],i)=>{const c=cat("out",k);return`<div class="lg"><span style="background:${COL[i%10]}"></span>${c?c.name:"(eliminata)"}<em>${Math.round(v/s*100)}%</em></div>`}).join("");
 const top=o.slice().sort((x,y)=>y.amount-x.amount).slice(0,5).map((t,i)=>`<div class="r" data-act="edit" data-id="${t.id}"><div><b>${i+1}. ${t.note||lab(t)}</b><small>${lab(t)} · ${t.date.slice(8)}/${t.date.slice(5,7)}</small></div><span class="out">${eur(t.amount)}</span></div>`).join("");
 const B=S.cfg.budgets||{};let tb=0,ts=0;
 const tr=S.cfg.cats.out.map(c=>{const b=+B[c.id]||0,x=by[c.id]||0,pc=b?Math.round(x/b*100):0;tb+=b;ts+=x;const col=pc>=100?"var(--red)":pc>=80?"var(--sand)":"var(--green)";
  return`<tr><td>${c.name}<td><input type="number" step="1" inputmode="decimal" data-chg="bud" data-id="${c.id}" value="${b||""}" placeholder="0"><td>${eur(x)}<td><b>${b?eur(b-x):"—"}</b><td><div class="bar"><div style="width:${Math.min(pc,100)}%;background:${col}"></div></div><td>${b?(pc>=100?"⛔":pc>=80?"⚠️":"✅")+" "+pc+"%":"—"}</tr>`}).join("");
 return bkBanner()+`<p style="margin:2px 2px 12px;color:var(--mut)">${e?`🎉 A ${MN[S.m].toLowerCase()} hai messo da parte il ${rt}% delle entrate.`:"Nessuna entrata registrata questo mese."}</p><div class="k4">${K.map(k=>`<div class="kpi" style="border-top-color:${k[3]}"><small>${k[0]}</small><b>${k[1]}</b><i>${k[2]}</i></div>`).join("")}</div>${upBox()}${goalsBox()}<div class="card"><h3 class="t">🍩 Dove vanno i tuoi soldi</h3>${s?`<div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center"><svg viewBox="0 0 42 42" width="150" height="150">${arcs}</svg><div style="flex:1;min-width:170px">${lg}</div></div>`:'<p style="color:var(--mut)">Nessuna spesa registrata.</p>'}</div><div class="card"><h3 class="t">🏆 Le spese più grandi</h3>${top||'<p style="color:var(--mut)">—</p>'}</div><div class="card"><h3 class="t">Dettaglio budget per categoria <small style="color:var(--mut);font-weight:400">(tocca il budget per modificarlo)</small></h3><div class="tb"><table><thead><tr><th>CATEGORIA<th>BUDGET<th>SPESO<th>RIMANENTE<th style="width:24%">AVANZAMENTO<th>STATO</tr></thead><tbody>${tr}<tr><td><b>Totale</b><td><b>${tb?eur(tb):"—"}</b><td><b>${eur(ts)}</b><td><b>${tb?eur(tb-ts):"—"}</b><td><td></tr></tbody></table></div></div>`},
due(){const td=isoD(new Date()),D=(S.cfg.due||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
 return D.map(d=>`<div class="card"><div class="row"><b style="flex:1">${d.name}</b><b class="${d.date<td?"out":""}">${eur(d.amount)}</b></div><small style="color:var(--mut)">${d.date<td?"⚠️ scaduta il ":"entro il "}${fmtD(d.date)} · ${lab(d)} · ${acc(d.acc)}${d.rep?" · ogni mese":""}</small><div class="row" style="margin-top:8px"><button class="pri" data-act="paid" data-id="${d.id}">✓ Pagata</button><button data-act="ics" data-id="${d.id}">📅 Calendario</button><button class="x" data-act="deldue" data-id="${d.id}">✕</button></div></div>`).join("")||'<p style="text-align:center;color:var(--mut)">Nessuna scadenza.</p>'
 +`<div class="card"><b>Nuova scadenza</b><div class="row" style="margin-top:8px"><input id="dn" placeholder="Nome (es. Retta nido)"><input id="dm" type="number" step="0.01" inputmode="decimal" placeholder="€" style="max-width:90px"></div><div class="row"><input id="dd" type="date" value="${td}"><select id="da">${opt(S.cfg.accounts,"")}</select></div><div class="row"><select id="dc"></select><select id="ds"></select></div><label style="display:flex;gap:8px;align-items:center;margin:6px 0"><input type="checkbox" id="dr" style="width:auto"> Si ripete ogni mese</label><button class="pri" data-act="adddue" style="width:100%">Aggiungi scadenza</button><p style="color:var(--mut);font-size:12px">Con “Pagata” si apre il movimento già compilato: correggi l’importo reale e salva. Per l’avviso usa “Calendario”: l’app da sola non può mandare notifiche quando è chiusa.</p></div>`},
rec(){const R=S.cfg.rec||[];return R.map(r=>`<div class="card"><div class="row"><b style="flex:1">${r.type==="in"?"+":"−"}${eur(r.amount)} · ${lab(r)}</b><button class="x" data-act="delrec" data-id="${r.id}">✕</button></div><small style="color:var(--mut)">Il giorno ${r.day} di ogni mese · ${acc(r.acc)} · dal ${r.start.slice(8)}/${r.start.slice(5,7)}/${r.start.slice(0,4)}${r.note?" · "+r.note:""}</small></div>`).join("")||'<p style="text-align:center;color:var(--mut)">Nessuna ricorrenza.</p>'
 +`<div class="card"><b>Nuova ricorrenza</b><div class="row" style="margin-top:8px"><select id="rt"><option value="out">Spesa</option><option value="in">Entrata</option></select><input id="rm" type="number" step="0.01" inputmode="decimal" placeholder="Importo €"></div><div class="row"><select id="rc"></select><select id="rs"></select></div><div class="row"><select id="ra">${opt(S.cfg.accounts,"")}</select><input id="rd" type="number" min="1" max="31" placeholder="Giorno (1-31)" style="max-width:130px"></div><div class="row"><input id="rf" type="date" value="${isoD(new Date())}"><input id="rn" placeholder="Nota (facoltativa)"></div><button class="pri" data-act="addrec" style="width:100%">Aggiungi ricorrenza</button><p style="color:var(--mut);font-size:12px">Il movimento viene creato ogni mese, dalla data indicata, quando apri l’app (e porta il simbolo ↻). Se lo elimini, quel mese non viene ricreato.</p></div>`},
mov(){const a=mt().filter(qf);let h=`<input data-chg="q" value="${S.q.replace(/"/g,"&quot;")}" placeholder="Cerca (nota, categoria, conto, importo)" style="width:100%;margin-bottom:8px"><div class="sg"><button data-act="view" data-v="list" class="${S.view==="list"?"on":""}">Elenco</button><button data-act="view" data-v="cal" class="${S.view==="cal"?"on":""}">Calendario</button></div>`;
 if(S.view==="list")return h+`<div class="card">${days(a)}</div>`;
 const off=(new Date(S.y,S.m,1).getDay()+6)%7,nd=new Date(S.y,S.m+1,0).getDate();let c=["L","M","M","G","V","S","D"].map(x=>`<div class="h">${x}</div>`).join("")+'<div class="d e"></div>'.repeat(off);
 for(let d=1;d<=nd;d++){const k=ym(S.y,S.m)+"-"+String(d).padStart(2,"0"),l=a.filter(t=>t.date===k),i=sum(l,"in"),o=sum(l,"out");
  c+=`<div class="d ${S.day===k?"sel":""}" data-act="day" data-v="${k}"><b>${d}</b>${i?`<i class="in">+${Math.round(i)}</i>`:""}${o?`<i class="out">−${Math.round(o)}</i>`:""}</div>`}
 return h+`<div class="card"><div class="cal">${c}</div></div>`+(S.day?`<div class="card">${days(a.filter(t=>t.date===S.day))}</div>`:"")},

function genCard(){if(!S.cfg||!S.txL)return;const td=isoD(new Date()),sk=S.cfg.skipIds||[];
 S.cfg.accounts.filter(a=>a.card&&a.card.pay).forEach(a=>{const by={};S.tx.forEach(t=>{if(t.acc===a.id&&(t.type==="out"||t.type==="in")){const k=t.date.slice(0,7);by[k]=(by[k]||0)+(t.type==="out"?t.amount:-t.amount)}});

function annual(){const Y=S.y,fy=y=>S.tx.filter(t=>t.date.slice(0,4)===String(y)&&t.type==="out"&&fw(t)),cur={},prv={},det={};
 fy(Y).forEach(t=>{cur[t.cat]=(cur[t.cat]||0)+t.amount;if(t.det)det[t.cat]=(det[t.cat]||0)+t.amount});fy(Y-1).forEach(t=>prv[t.cat]=(prv[t.cat]||0)+t.amount);
 const nm=id=>{const c=cat("out",id);return c?c.name:"(eliminata)"},ks=[...new Set([...Object.keys(cur),...Object.keys(prv)])].sort((a,b)=>(cur[b]||0)-(cur[a]||0)),dt=Object.values(det).reduce((a,b)=>a+b,0);
